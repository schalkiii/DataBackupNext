name: Debug APK

# 免签名 Debug APK 云端构建：本地零安装，触发后在 Actions 的 Artifacts 里下载 APK。
# 与 build.yaml（签名 Release，需 signing secrets）互补；单元测试由 lint.yaml 在 push/PR 时覆盖。
on:
  workflow_dispatch:
    inputs:
      feature:
        description: 'Feature flavor'
        type: choice
        options: [ foss, premium, alpha ]
        default: foss
      abi:
        description: 'ABI (all = 全部 ABI)'
        type: choice
        options: [ arm64-v8a, armeabi-v7a, x86_64, x86, all ]
        default: arm64-v8a
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source

    permissions:
      contents: read

    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      # gradle-build-action 自带 Gradle User Home 缓存，加速增量构建
      - name: Setup gradle
        uses: gradle/gradle-build-action@v2

      - name: Setup gradlew
        run: chmod +x gradlew

      - name: Resolve gradle tasks
        id: tasks
        env:
          INPUT_FEATURE: ${{ github.event.inputs.feature }}
          INPUT_ABI: ${{ github.event.inputs.abi }}
        run: |
          # push/tag 触发时未指定输入，默认 foss + arm64-v8a
          FEATURE="${INPUT_FEATURE:-foss}"
          ABI="${INPUT_ABI:-arm64-v8a}"
          # 显式映射 ABI/feature 到 Gradle 变体片段，避免依赖 shell 大小写扩展
          variant_abi() {
            case "$1" in
              arm64-v8a)   echo "Arm64-v8a" ;;
              armeabi-v7a) echo "Armeabi-v7a" ;;
              x86_64)      echo "X86_64" ;;
              x86)         echo "X86" ;;
              *)           echo "Arm64-v8a" ;;
            esac
          }
          variant_feature() {
            case "$1" in
              premium) echo "Premium" ;;
              alpha)   echo "Alpha" ;;
              *)       echo "Foss" ;;
            esac
          }
          if [ "$ABI" = "all" ]; then
            ABIS="arm64-v8a armeabi-v7a x86_64 x86"
          else
            ABIS="$ABI"
          fi
          FV="$(variant_feature "$FEATURE")"
          TASKS=""
          for a in $ABIS; do
            # 拼接 assemble<Abi><Feature>Debug，如 assembleArm64-v8aFossDebug
            TASKS="$TASKS assemble$(variant_abi "$a")${FV}Debug"
          done
          TASKS="${TASKS# }"
          echo "tasks=$TASKS" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: ./gradlew ${{ steps.tasks.outputs.tasks }} --parallel

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: source/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
